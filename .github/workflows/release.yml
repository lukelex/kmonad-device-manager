name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build release archive
        env:
          VERSION: ${{ github.ref_name }}
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p dist/package dist/binary
          docker buildx build \
            --platform "linux/$GOARCH" \
            --target release \
            --build-arg VERSION="$VERSION" \
            --output "type=local,dest=$GITHUB_WORKSPACE/dist/binary" \
            .
          install -m755 dist/binary/kmonad-device-manager \
            dist/package/kmonad-device-manager
          cp LICENSE README.md dist/package/
          cp install.sh dist/package/
          mkdir -p dist/package/systemd dist/package/completions dist/package/system
          cp systemd/kmonad-device-manager.service dist/package/systemd/
          cp completions/kmonad-device-manager.* dist/package/completions/
          cp system/70-kmonad-uinput.rules system/uinput.conf dist/package/system/
          mkdir -p dist/package/share/man/man1
          cp docs/kmonad-device-manager.1 dist/package/share/man/man1/
          archive="dist/kmonad-device-manager-${VERSION}-linux-${GOARCH}.tar.gz"
          source_date_epoch="$(git log -1 --format=%ct)"
          tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 --numeric-owner \
            -cf - -C dist/package . | gzip -n > "$GITHUB_WORKSPACE/$archive"
          sha256sum "$archive" > \
            "dist/kmonad-device-manager-${VERSION}-linux-${GOARCH}.sha256"
          rm -rf dist/package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true
      - name: Generate source SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/kmonad-device-manager.sbom.spdx.json
      - name: Generate combined checksums
        run: sha256sum dist/*.tar.gz > dist/SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: docs/releases/${{ github.ref_name }}.md
