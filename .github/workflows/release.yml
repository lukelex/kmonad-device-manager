name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release archive
        env:
          VERSION: ${{ github.ref_name }}
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p dist/package
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" \
            go build -trimpath -ldflags="-s -w -X main.version=$VERSION" \
            -o dist/package/kmonad-device-manager ./cmd/kmonad-device-manager
          cp LICENSE README.md dist/package/
          cp install.sh dist/package/
          mkdir -p dist/package/systemd dist/package/completions dist/package/system
          cp systemd/kmonad-device-manager.service dist/package/systemd/
          cp completions/kmonad-device-manager.* dist/package/completions/
          cp system/70-kmonad-uinput.rules system/uinput.conf dist/package/system/
          mkdir -p dist/package/share/man/man1
          cp docs/kmonad-device-manager.1 dist/package/share/man/man1/
          archive="dist/kmonad-device-manager-${VERSION}-linux-${GOARCH}.tar.gz"
          source_date_epoch="$(git log -1 --format=%ct)"
          tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 --numeric-owner \
            -cf - -C dist/package . | gzip -n > "$GITHUB_WORKSPACE/$archive"
          sha256sum "$archive" > \
            "dist/kmonad-device-manager-${VERSION}-linux-${GOARCH}.sha256"
          rm -rf dist/package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/kmonad-device-manager.sbom.spdx.json
      - name: Generate combined checksums
        run: sha256sum dist/*.tar.gz > dist/SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
