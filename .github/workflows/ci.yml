name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - go: '1.23.x'
            runner: ubuntu-latest
            coverage: false
          - go: stable
            runner: ubuntu-latest
            coverage: true
          - go: stable
            runner: ubuntu-24.04-arm
            coverage: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Test with race detection
        run: go test -race ./...
      - name: Test with coverage
        if: matrix.coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Report Go coverage
        if: matrix.coverage
        shell: bash
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          total="$(awk '/^total:/ { print $3 }' coverage.txt)"
          {
            echo '## Go coverage'
            echo
            echo "Statement coverage: **${total}**"
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html=coverage.out -o coverage.html
      - name: Enforce coverage threshold
        if: matrix.coverage
        run: ./tests/check-coverage.sh coverage.out 55
      - name: Upload coverage artifacts
        if: matrix.coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.txt
            coverage.html
      - name: Vet
        run: go vet ./...
      - name: Scan for known Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' ./cmd/kmonad-device-manager
      - name: Verify reproducible static build
        run: |
          first="$(mktemp)"
          second="$(mktemp)"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$first" ./cmd/kmonad-device-manager
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$second" ./cmd/kmonad-device-manager
          cmp "$first" "$second"
      - name: Integration test
        run: |
          ./tests/run.sh
          ./tests/install.sh
      - name: Validate service and scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          systemd-analyze --user verify systemd/kmonad-device-manager.service
          bash -n install.sh uninstall.sh tests/run.sh tests/install.sh tests/check-coverage.sh packaging/arch/PKGBUILD
          shellcheck install.sh uninstall.sh tests/run.sh tests/install.sh tests/check-coverage.sh
