name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync managed Wiki pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-published; then
            echo "::error::GitHub Wiki is unavailable. Enable Wiki in the repository Features settings, create its first page if GitHub has not initialized the Wiki repository, then rerun this workflow."
            exit 1
          fi
          install -m644 wiki/Home.md wiki-published/Home.md
          install -m644 wiki/Installation.md wiki-published/Installation.md
          install -m644 wiki/Keyboard-Configuration.md wiki-published/Keyboard-Configuration.md
          install -m644 wiki/Command-Reference.md wiki-published/Command-Reference.md
          install -m644 wiki/Troubleshooting.md wiki-published/Troubleshooting.md
          install -m644 wiki/Development.md wiki-published/Development.md
          install -m644 wiki/Manager-API-v1.md wiki-published/Manager-API-v1.md
          install -m644 wiki/KeyboarDeer-Manager-Contract.md wiki-published/KeyboarDeer-Manager-Contract.md
          install -m644 wiki/GUI-Integration-Plan.md wiki-published/GUI-Integration-Plan.md
          cd wiki-published
          if git diff --quiet -- Home.md Installation.md Keyboard-Configuration.md Command-Reference.md Troubleshooting.md Development.md Manager-API-v1.md KeyboarDeer-Manager-Contract.md GUI-Integration-Plan.md && [ -z "$(git ls-files --others --exclude-standard -- Installation.md Keyboard-Configuration.md Troubleshooting.md Development.md)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Home.md Installation.md Keyboard-Configuration.md Command-Reference.md Troubleshooting.md Development.md Manager-API-v1.md KeyboarDeer-Manager-Contract.md GUI-Integration-Plan.md
          git commit -m "docs: sync repository Wiki"
          git push
