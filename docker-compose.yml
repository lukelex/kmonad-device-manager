name: kmonad-device-manager

x-development: &development
  build:
    context: .
    dockerfile: Dockerfile
    target: development
  working_dir: /workspace
  init: true
  volumes:
    - .:/workspace
    - go-build-cache:/root/.cache/go-build
    - go-module-cache:/go/pkg/mod

x-git: &git
  build:
    context: .
    dockerfile: Dockerfile.git
  working_dir: /workspace
  init: true
  volumes:
    - .:/workspace
    - .git:/workspace/.git
    - ${HOME}/.ssh:/root/.ssh:ro

services:
  dev:
    <<: *development
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true

  test:
    <<: *development
    command:
      - bash
      - -ceu
      - |
        go test ./...
        CGO_ENABLED=1 go test -race ./...
        go vet ./...
        ./tests/run.sh
        runuser -u nobody -- env HOME=/tmp USER=nobody GOFLAGS=-buildvcs=false bash tests/install.sh
        systemd-analyze verify systemd/kmonad-device-manager.service
        bash -n install.sh uninstall.sh tests/run.sh tests/check-release.sh packaging/arch/PKGBUILD
        shellcheck install.sh uninstall.sh tests/run.sh tests/install.sh tests/systemd-user.sh tests/check-release.sh

  test-install:
    <<: *development
    user: "65534:65534"
    environment:
      HOME: /tmp
      USER: nobody
      GOTOOLCHAIN: local
    command: ["bash", "tests/install.sh"]

  git:
    <<: *git
    command: ["sleep", "infinity"]

volumes:
  go-build-cache:
  go-module-cache:
